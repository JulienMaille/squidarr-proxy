name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache-dependency-path: src/go.sum

      - name: Test
        working-directory: src
        run: go test ./...

      - name: Build and package minimal Windows ZIP
        shell: pwsh
        working-directory: src
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'squidarr-proxy-release'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'client') | Out-Null

          go build -trimpath -ldflags='-s -w' -o (Join-Path $stage 'squidarr-proxy.exe') .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item ..\start_squidarr.bat $stage
          Copy-Item ..\config.env.example $stage
          @'
          Squidarr Proxy - Windows quick start

          1. Copy config.env.example to config.env.
          2. Set your private API_KEY and DOWNLOAD_PATH in config.env.
          3. Add DEEZER_API_KEY if you are authorized to use the Deezer backend.
          4. Run start_squidarr.bat.
          5. Open client\index.html and enter the proxy URL and API key.

          Keep config.env and all credentials private.
          '@ | Set-Content -Path (Join-Path $stage 'README.txt') -Encoding utf8
          Copy-Item ..\LICENSE $stage
          Copy-Item ..\client\index.html (Join-Path $stage 'client\index.html')

          $archive = Join-Path $env:GITHUB_WORKSPACE "squidarr-proxy-windows-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -Force
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME "$env:RELEASE_ARCHIVE" --verify-tag --title $env:GITHUB_REF_NAME --generate-notes
