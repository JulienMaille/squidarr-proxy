services:
  squidarr-proxy:
    image: ghcr.io/mgthepro/squidarr-proxy:main
    container_name: squidarr-proxy
    environment:
      - TZ=Europe/Paris
      - DOWNLOAD_PATH=/data/squidarr
      # Full-length Qobuz backend (Navidrums routes). Its premium pool serves
      # complete FLAC files instead of 30s previews. Optional but recommended.
      - QOBUZ_NAV_LINK=https://qobuz.itzsantiax.qzz.io
      # The API Key is the password to your instance, set when configuring indexer and downloader in Lidarr
      # Set any value you wish here, but do not leave it empty
      - API_KEY=
    user: "1000:1000"
    volumes:
      - ./downloads/folder/here:/data/squidarr
    ports:
      - "8687:8687"
    restart: unless-stopped
